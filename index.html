<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO App</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237e22ce'/><path d='M28 53 L42 66 L72 34' fill='none' stroke='%23ffffff' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .shadow-ne-outset {
            box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.06),
                -6px_-6px_12px rgba(255, 255, 255, 0.7);
        }

        .shadow-ne-inset {
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.1),
                inset_-3px_-3px_7px rgba(255, 255, 255, 0.7);
        }

        .shadow-ne-outset-sm {
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.04),
                -3px_-3px_6px rgba(255, 255, 255, 0.6);
        }

        .todo-item:hover {
            box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.08),
                -8px_-8px_16px rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeInSlideDown {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .faded-slide-in {
            animation: fadeInSlideDown 0.4s ease-out;
        }
    </style>
</head>

<body class="min-h-screen bg-neutral-100 font-sans text-neutral-800">
    <nav class="bg-purple-700 text-white shadow-ne-outset">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">TO-DO App</h1>
            <div class="space-x-6 font-medium">
                <a href="#Home" class="hover:text-purple-200 transition-colors">Home</a>
                <a href="#Tasks" class="hover:text-purple-200 transition-colors">Tasks</a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto mt-12 px-4 pb-12">
        <div class="bg-neutral-100 rounded-2xl shadow-ne-outset overflow-hidden p-8">

            <div class="bg-purple-50 px-8 py-6 border-b border-purple-100 rounded-t-2xl mb-8 shadow-ne-inset">
                <h2 class="text-2xl font-bold text-purple-900 mb-2">
                    Write what you'll do throughout the day !!
                </h2>
                <p class="text-purple-600 text-sm">Stay organized and boost your productivity.</p>
            </div>

            <div class="mb-10">
                <div class="flex flex-col sm:flex-row gap-3 bg-white/50 p-3 rounded-xl shadow-ne-inset">
                    <input id="todo-input" type="text" placeholder="Write Your TO-DO here..."
                        class="flex-1 bg-white border border-neutral-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-300 text-neutral-700 placeholder-neutral-400 shadow-ne-inset" />
                    <button onclick="addTodo()"
                        class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-8 py-3 rounded-lg shadow-ne-outset transition-all duration-200 active:scale-95 whitespace-nowrap flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4">
                            </path>
                        </svg>
                        Add Task
                    </button>
                </div>
            </div>

            <div>
                <h3 class="text-lg font-semibold text-neutral-700 border-b pb-2 mb-4">
                    Your Todos :
                </h3>

                <div id="empty-state"
                    class="text-center py-8 text-neutral-400 italic bg-white rounded-lg border border-dashed border-neutral-300 shadow-ne-inset">
                    No tasks yet. Add one above!
                </div>

                <ul id="todo-list" class="space-y-4"></ul>
            </div>
        </div>
    </main>

    <script>
        let todos = [];
        let editingId = null;

        const inputField = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');

        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        function addTodo() {
            const text = inputField.value.trim();
            if (text === "") return;

            const id = Date.now();

            todos.push({
                id: id,
                text: text,
                completed: false,
                isNew: true
            });

            inputField.value = "";
            renderTodos();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            renderTodos();
        }

        function toggleComplete(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                renderTodos();
            }
        }

        function startEdit(id) {
            editingId = id;
            renderTodos();
        }

        function saveEdit(id, newText) {
            if (newText.trim() === "") return;
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.text = newText;
            }
            editingId = null;
            renderTodos();
        }

        const iconPencil = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>';
        const iconTrash = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
        const iconCheck = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';

        function renderTodos() {
            todoList.innerHTML = "";

            if (todos.length === 0) {
                emptyState.style.display = "block";
            } else {
                emptyState.style.display = "none";
            }

            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = "todo-item bg-white border border-neutral-100 rounded-lg p-5 transition-all flex items-center gap-4 shadow-ne-outset-sm";

                if (todo.isNew) {
                    li.classList.add('faded-slide-in');
                    delete todo.isNew;
                }

                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.title = "Mark complete";
                checkbox.checked = todo.completed;
                checkbox.className = "w-6 h-6 text-purple-600 rounded border-neutral-300 cursor-pointer focus:ring-purple-300 shadow-ne-inset";
                checkbox.onchange = () => toggleComplete(todo.id);
                li.appendChild(checkbox);

                const textContainer = document.createElement('div');
                textContainer.className = "flex-1 text-base";

                if (editingId === todo.id) {
                    const editInput = document.createElement('input');
                    editInput.type = "text";
                    editInput.value = todo.text;
                    editInput.className = "w-full border border-purple-300 rounded-md px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-purple-300 text-neutral-700 shadow-ne-inset bg-white";
                    editInput.onkeydown = (e) => {
                        if (e.key === 'Enter') saveEdit(todo.id, editInput.value);
                    };
                    textContainer.appendChild(editInput);

                    setTimeout(() => editInput.focus(), 0);
                } else {
                    const textSpan = document.createElement('span');
                    textSpan.textContent = todo.text;
                    textSpan.className = `text-neutral-700 ${todo.completed ? 'line-through text-neutral-400' : 'text-neutral-800'}`;
                    textContainer.appendChild(textSpan);
                }
                li.appendChild(textContainer);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = "flex gap-3 ml-2";

                if (editingId === todo.id) {
                    const saveBtn = document.createElement('button');
                    saveBtn.innerHTML = iconCheck;
                    saveBtn.title = "Save";
                    saveBtn.className = "text-green-600 hover:text-green-700 hover:bg-green-50 p-2.5 rounded-lg transition-colors active:scale-95 shadow-ne-outset-sm";
                    saveBtn.onclick = () => {
                        const inputElement = textContainer.querySelector('input');
                        saveEdit(todo.id, inputElement.value);
                    };
                    actionsDiv.appendChild(saveBtn);
                } else {
                    const editBtn = document.createElement('button');
                    editBtn.innerHTML = iconPencil;
                    editBtn.title = "Edit";
                    editBtn.className = "text-yellow-600 hover:text-yellow-700 hover:bg-yellow-50 p-2.5 rounded-lg transition-colors active:scale-95 shadow-ne-outset-sm";
                    editBtn.onclick = () => startEdit(todo.id);
                    actionsDiv.appendChild(editBtn);
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = iconTrash;
                deleteBtn.title = "Delete";
                deleteBtn.className = "text-red-600 hover:text-red-700 hover:bg-red-50 p-2.5 rounded-lg transition-colors active:scale-95 shadow-ne-outset-sm";
                deleteBtn.onclick = () => deleteTodo(todo.id);
                actionsDiv.appendChild(deleteBtn);

                li.appendChild(actionsDiv);
                todoList.appendChild(li);
            });
        }
    </script>
</body>

</html>
